server {
    # Escucha peticiones HTTP en el puerto 80 del contenedor
    listen 80;
    # Acepta peticiones para cualquier nombre de dominio o IP
    server_name _;
    # Ruta del directorio raíz donde se ubican los archivos de WordPress
    root /var/www/html;
    # Archivos que se buscarán por defecto al acceder a un directorio
    index index.php;
    # Tamaño máximo permitido para la subida de archivos
    client_max_body_size 64M;

    # Redirige cualquier petición a index.php para permitir URLs amigables
    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    # Procesa todos los archivos con extensión .php a través de PHP-FPM
    location ~ \.php$ {
        include fastcgi_params;
        # Envía la ejecución PHP al servicio wordpress en el puerto 9000
        fastcgi_pass wordpress:9000;
        # Define la ruta absoluta del script PHP que se debe ejecutar
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }
}
