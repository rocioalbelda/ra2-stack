services:
  nginx:
    image: nginx:stable
    ports:
      - "8080:80"
    volumes:
      - wp_data:/var/www/html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - wordpress

  wordpress:
    image: wordpress:php8.3-fpm
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: ${WP_DB_NAME}
      WORDPRESS_DB_USER: ${WP_DB_USER}
      WORDPRESS_DB_PASSWORD: ${WP_DB_PASSWORD}
      WORDPRESS_CONFIG_EXTRA: |
        define('DISALLOW_FILE_EDIT', true);
        $$iaw_host  = isset($$_SERVER['HTTP_X_FORWARDED_HOST']) ? $$_SERVER['HTTP_X_FORWARDED_HOST'] : $$_SERVER['HTTP_HOST'];
        $$iaw_proto = isset($$_SERVER['HTTP_X_FORWARDED_PROTO']) ? $$_SERVER['HTTP_X_FORWARDED_PROTO'] : 'http';
        define('WP_HOME',    $$iaw_proto . '://' . $$iaw_host);
        define('WP_SITEURL', $$iaw_proto . '://' . $$iaw_host);
    volumes:
      - wp_data:/var/www/html
      - ./config/uploads.ini:/usr/local/etc/php/conf.d/uploads.ini:ro
    depends_on:
      - db

  db:
    image: mariadb:11
    env_file: .env
    volumes:
      - db_data:/var/lib/mysql

volumes:
  wp_data:
  db_data: